<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Maula Azizah - QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 24px;
      text-align: center;
      color: #111;
    }
    .qr-container {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
    }
    .url-info {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #666;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      margin: 8px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      color: white;
      display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: none;
      cursor: pointer;
    }
    .wa { background: #25D366; }
    .ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .maps { background: #4285F4; }
    .download { background: #FF9500; }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Hubungi Maula Azizah</h1>
  
  <div class="qr-container">
    <div id="qrcode"></div>
    <div class="url-info">
      Scan untuk mengakses kontak lengkap
    </div>
  </div>

  <a class="btn wa" href="https://wa.me/6289508151743" target="_blank">💬 Chat WhatsApp</a>
  <a class="btn ig" href="https://www.instagram.com/maulaazizah21?igsi=NmNzd3NiejR1NHNw" target="_blank">📸 Lihat Instagram</a>
  <a class="btn maps" href="https://maps.app.goo.gl/pL2yK6qbAWJEnrdG8" target="_blank">📍 Buka Lokasi</a>
  <button class="btn download" onclick="downloadQRCode()">⬇️ Download QR Code</button>
  
  <div class="footer">Scan 1x, pilih yang kamu mau</div>

  <script>
    // Generate QR Code
    const qrUrl = window.location.href;
    new QRCode(document.getElementById("qrcode"), {
      text: qrUrl,
      width: 256,
      height: 256,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    // Download QR Code function
    function downloadQRCode() {
      const canvas = document.querySelector('#qrcode canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'hubungi_maula_azizah_qr.png';
        link.click();
      }
    }
  </script>
</body>
</html>
