    * { box-sizing: border-box; }

      height: auto;
      display: block;
      border-radius: 12px;
    }

    p { margin: 0 0 22px; color: #666; text-align: center; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      margin: 6px 0;
      background: #25D366;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(.95); }
  </style>
